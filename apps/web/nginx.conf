map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api http://server:9100;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # Manifest riêng cho từng nhân viên: app cài từ /l/<id> sẽ mở lại đúng /l/<id>
  location ~ "^/m/([a-f0-9]{24})\.webmanifest$" {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    return 200 '{"name":"Bill Capture","short_name":"Bill Capture","lang":"vi","id":"/l/$1","start_url":"/l/$1","scope":"/","display":"standalone","orientation":"portrait","background_color":"#ffffff","theme_color":"#ffffff","icons":[{"src":"/pwa-192x192.png","sizes":"192x192","type":"image/png"},{"src":"/pwa-512x512.png","sizes":"512x512","type":"image/png"},{"src":"/maskable-icon-512x512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}]}';
  }

  # Trang link: vẫn là index.html nhưng manifest trỏ sang bản riêng ở trên
  location ~ "^/l/([a-f0-9]{24})$" {
    add_header Cache-Control "no-cache";
    sub_filter '/manifest.webmanifest' '/m/$1.webmanifest';
    sub_filter_once on;
    try_files /index.html =404;
  }

  location = /index.html            { add_header Cache-Control "no-cache"; }
  location = /sw.js                 { add_header Cache-Control "no-cache"; }
  location = /registerSW.js         { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}