services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        PNPM_VERSION: "10"
    pull_policy: build            # luôn build lại khi redeploy
    container_name: bill-capture-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "9100"
      TRUST_PROXY: "2"            # NPM + nginx của web
      MONGODB_URI: ${MONGODB_URI:?set in stack env}
      JWT_SECRET: ${JWT_SECRET:?set in stack env}
      OPENINARY_API_URL: ${OPENINARY_API_URL:-https://openinary.toantran.duckdns.org/api}
      OPENINARY_API_KEY: ${OPENINARY_API_KEY:?set in stack env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://an.catlonghouse.cloud}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/api/auth/me').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PNPM_VERSION: "10"
    pull_policy: build
    container_name: bill-capture-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "9110:80"                 # đổi nếu cổng này đã bị dùng

